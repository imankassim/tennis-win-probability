[project]
name = "courtedge"
version = "0.1.0"
description = "CourtEdge — an in-play tennis probability and pricing research prototype."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
